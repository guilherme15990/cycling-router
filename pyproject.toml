[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roteamento-engine"
version = "0.11.0"
description = "Motor de roteamento ciclavel: grafo OSM, snapping, modelo fisico, perfil eletrico e busca multiobjetivo"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dem = ["rasterio>=1.3", "numpy>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
roteamento = "cli:main"

[tool.setuptools]
py-modules = ["api", "cli", "elevation", "geo", "snapping"]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: o pacote distribui tipos inline; o marcador ``py.typed`` precisa
# acompanhar cada pacote instalado.
[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
